name: Build e Deploy do Cliente Display

on:
  push:
    branches: [main]
    paths:
      - 'display-client/**'
  workflow_dispatch:

jobs:
  # ── Job 1: build no Windows (único SO que gera .exe nativamente) ─────────────
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: display-client
        run: npm install

      - name: Build instalador Windows
        working-directory: display-client
        run: npm run build:win

      - name: Salvar exe como artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-windows
          path: display-client/dist/WNRMidiaDisplay-Setup.exe
          retention-days: 1

  # ── Job 2: deploy no Linux (ssh-action/scp-action exigem Linux) ─────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar exe do artifact
        uses: actions/download-artifact@v4
        with:
          name: exe-windows
          path: ./dist

      - name: Criar diretório downloads no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script: mkdir -p /var/www/wnrmidia/downloads

      - name: Enviar exe para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          source: "dist/WNRMidiaDisplay-Setup.exe"
          target: "/var/www/wnrmidia/downloads/"
          strip_components: 1

      - name: Verificar upload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script: |
            ls -lh /var/www/wnrmidia/downloads/
            echo "Disponivel em: https://wnrtecnologia.com.br/wnrmidia/downloads/WNRMidiaDisplay-Setup.exe"
