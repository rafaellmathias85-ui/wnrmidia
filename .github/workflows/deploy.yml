name: Deploy para Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script: |
            set -e
            APP_DIR="/var/www/wnrmidia"

            # --- Node.js ---
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # --- PM2 ---
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # --- ffmpeg ---
            if ! command -v ffmpeg &> /dev/null; then
              sudo apt-get install -y ffmpeg
            fi

            # --- Repositório ---
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR" && git pull origin main
            else
              sudo mkdir -p "$APP_DIR"
              sudo chown $USER:$USER "$APP_DIR"
              git clone https://github.com/rafaellmathias85-ui/wnrmidia.git "$APP_DIR"
            fi

            # --- Backend ---
            cd "$APP_DIR/backend"
            npm install --production

            if [ ! -f .env ]; then
              printf "NODE_ENV=development\nPORT=5000\nJWT_SECRET=%s\nJWT_EXPIRE=7d\nVIDEO_UPLOAD_PATH=./uploads/videos\nMAX_VIDEO_SIZE=500000000\n" "$(openssl rand -hex 32)" > .env
            fi

            mkdir -p uploads/videos
            npx knex migrate:latest
            npx knex seed:run --specific=001_users.js 2>/dev/null || true

            # --- Admin Panel build ---
            cd "$APP_DIR/admin-panel"
            npm install
            printf "REACT_APP_API_URL=http://4.228.218.45/wnrmidia/app/api\nREACT_APP_SOCKET_URL=http://4.228.218.45\n" > .env.production
            npm run build

            # --- PM2 ---
            cd "$APP_DIR"
            if pm2 list | grep -q wnrmidia-backend; then
              pm2 reload wnrmidia-backend
            else
              pm2 start ecosystem.config.js
            fi
            pm2 save
            sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u $USER --hp $HOME 2>/dev/null || true

            # --- Nginx: injetar location blocks via script Python do repo ---
            echo "=== sites-enabled ==="
            ls -la /etc/nginx/sites-enabled/

            echo "=== configs com listen 80 ==="
            grep -rl "listen 80" /etc/nginx/sites-enabled/ 2>/dev/null || echo "nenhum"

            sudo python3 "$APP_DIR/scripts/nginx_inject.py"

            echo "=== nginx test ==="
            sudo nginx -t

            echo "=== locations wnrmidia na config efetiva ==="
            sudo nginx -T 2>/dev/null | grep -A2 "wnrmidia" || echo "nao encontrado"

            sudo systemctl reload nginx

            echo ""
            echo "Deploy concluido!"
            echo "  Admin: http://4.228.218.45/wnrmidia/app"
            echo "  API  : http://4.228.218.45/wnrmidia/app/api"
            pm2 status
