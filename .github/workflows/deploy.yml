name: Deploy para Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script: |
            set -e
            APP_DIR="/var/www/wnrmidia"

            # Instalar Node.js se necessário
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Instalar PM2 se necessário
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Instalar nginx e ffmpeg se necessário
            if ! command -v nginx &> /dev/null; then
              sudo apt-get install -y nginx ffmpeg
            fi

            # Clonar ou atualizar repositório
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git pull origin main
            else
              sudo mkdir -p "$APP_DIR"
              sudo chown $USER:$USER "$APP_DIR"
              git clone https://github.com/rafaellmathias85-ui/wnrmidia.git "$APP_DIR"
              cd "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Backend: instalar dependências
            cd backend
            npm install --production

            # Criar .env se não existir
            if [ ! -f .env ]; then
              echo "NODE_ENV=development" > .env
              echo "PORT=5000" >> .env
              echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
              echo "JWT_EXPIRE=7d" >> .env
              echo "VIDEO_UPLOAD_PATH=./uploads/videos" >> .env
              echo "MAX_VIDEO_SIZE=500000000" >> .env
            fi

            # Criar pasta de uploads
            mkdir -p uploads/videos

            # Rodar migrações
            npx knex migrate:latest
            npx knex seed:run --specific=001_users.js 2>/dev/null || true

            cd "$APP_DIR"

            # Admin panel: build
            cd admin-panel
            npm install
            cat > .env.production << EOF
            REACT_APP_API_URL=http://${{ secrets.VM_HOST }}:5000/api
            REACT_APP_SOCKET_URL=http://${{ secrets.VM_HOST }}:5000
            EOF
            npm run build

            cd "$APP_DIR"

            # PM2: criar ecosystem e reiniciar
            cat > ecosystem.config.js << EOF
            module.exports = {
              apps: [{
                name: 'wnrmidia-backend',
                script: './backend/src/server.js',
                cwd: '$APP_DIR',
                env: { NODE_ENV: 'development', PORT: 5000 },
                watch: false,
                max_memory_restart: '512M',
                restart_delay: 5000,
              }]
            }
            EOF

            if pm2 list | grep -q wnrmidia-backend; then
              pm2 reload wnrmidia-backend
            else
              pm2 start ecosystem.config.js
            fi
            pm2 save

            # Nginx: configurar se não existir
            if [ ! -f /etc/nginx/sites-available/wnrmidia ]; then
              sudo tee /etc/nginx/sites-available/wnrmidia > /dev/null << EOF
            server {
                listen 8080;
                server_name _;
                root $APP_DIR/admin-panel/build;
                index index.html;
                location / {
                    try_files \$uri \$uri/ /index.html;
                }
                location /api {
                    proxy_pass http://localhost:5000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                }
                location /socket.io {
                    proxy_pass http://localhost:5000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection "upgrade";
                }
                location /uploads {
                    proxy_pass http://localhost:5000;
                    client_max_body_size 500M;
                }
            }
            EOF
              sudo ln -sf /etc/nginx/sites-available/wnrmidia /etc/nginx/sites-enabled/wnrmidia
              sudo nginx -t && sudo systemctl reload nginx
            fi

            echo "Deploy concluido com sucesso!"
            pm2 status
