name: Deploy para Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script: |
            set -e
            APP_DIR="/var/www/wnrmidia"

            # --- Node.js ---
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # --- PM2 ---
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # --- ffmpeg ---
            if ! command -v ffmpeg &> /dev/null; then
              sudo apt-get install -y ffmpeg
            fi

            # --- Repositório ---
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git clean -fd
              git reset --hard origin/main
            else
              sudo mkdir -p "$APP_DIR"
              sudo chown $USER:$USER "$APP_DIR"
              git clone https://github.com/rafaellmathias85-ui/wnrmidia.git "$APP_DIR"
            fi

            # --- Backend ---
            cd "$APP_DIR/backend"
            npm install --production

            # Gerar JWT_SECRET usando Node.js (garantido, openssl pode falhar)
            JWT_VAL=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")

            if [ ! -f .env ]; then
              printf "NODE_ENV=production\nPORT=5000\nJWT_SECRET=%s\nJWT_EXPIRE=7d\nVIDEO_UPLOAD_PATH=./uploads/videos\nMAX_VIDEO_SIZE=500000000\n" "$JWT_VAL" > .env
              echo "Arquivo .env criado com JWT_SECRET"
            else
              # Substituir JWT_SECRET vazio ou ausente
              if grep -q "^JWT_SECRET=" .env; then
                EXISTING_SECRET=$(grep "^JWT_SECRET=" .env | cut -d= -f2)
                if [ -z "$EXISTING_SECRET" ]; then
                  sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$JWT_VAL/" .env
                  echo "JWT_SECRET corrigido no .env"
                fi
              else
                echo "JWT_SECRET=$JWT_VAL" >> .env
                echo "JWT_SECRET adicionado ao .env"
              fi
            fi

            echo "=== Verificacao do .env ==="
            grep -v "SECRET\|PASSWORD" .env || true

            mkdir -p uploads/videos
            mkdir -p "$APP_DIR/downloads"
            # Remove rogue empty sqlite files that can be created by wrong path resolution
            rm -f "$APP_DIR/backend/src/wnrmidia.sqlite"
            rm -f "$APP_DIR/wnrmidia.sqlite"
            # Force development env so knex uses SQLite (not the PG production config)
            NODE_ENV=development npx knex migrate:latest
            NODE_ENV=development npx knex seed:run --specific=001_users.js 2>/dev/null || true

            # --- Admin Panel build ---
            cd "$APP_DIR/admin-panel"
            npm install
            printf "REACT_APP_API_URL=https://wnrtecnologia.com.br/wnrmidia/app/api\nREACT_APP_SOCKET_URL=https://wnrtecnologia.com.br\n" > .env.production
            npm run build

            # --- PM2 ---
            cd "$APP_DIR"
            if pm2 list | grep -q wnrmidia-backend; then
              pm2 restart wnrmidia-backend --update-env
            else
              pm2 start ecosystem.config.js
            fi
            pm2 save
            sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u $USER --hp $HOME 2>/dev/null || true

            # --- Nginx ---
            # Remove default do sites-enabled (wnrtecnologia tem o IP em server_name
            # e deve ser o unico server block ativo para evitar conflito).
            sudo rm -f /etc/nginx/sites-enabled/default
            # Injeta location blocks do WnrMidia no config do site principal (wnrtecnologia).
            sudo python3 "$APP_DIR/scripts/nginx_inject.py"
            sudo systemctl reload nginx

            echo ""
            echo "Deploy concluido!"
            echo "  Admin: http://4.228.218.45/wnrmidia/app"
            echo "  API  : http://4.228.218.45/wnrmidia/app/api"
            pm2 status
