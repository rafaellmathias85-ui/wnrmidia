<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>WNR Mídia Display</title>
  <link rel="stylesheet" href="player.css" />
</head>
<body>

  <!-- ── Stage (caixa rotacionável — dimensões e rotação via CSS vars) ── -->
  <div id="stage">
    <!-- Double-buffer: duas camadas que alternam com crossfade, sem flash preto -->
    <div class="layer" id="layer-a">
      <video class="media-video" muted playsinline preload="auto"></video>
      <img class="media-image" alt="" />
    </div>
    <div class="layer" id="layer-b">
      <video class="media-video" muted playsinline preload="auto"></video>
      <img class="media-image" alt="" />
    </div>
  </div>

  <!-- ── Tela de espera / erro ── -->
  <div id="waiting-screen" class="overlay-screen">
    <div class="overlay-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24"
        fill="none" stroke="#ffd400" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 6.3 4.8 9.4a2 2 0 0 1-2.3-1.6l-.2-1A2 2 0 0 1 3.9 4.5l13.4-2.7a2 2 0 0 1 2.3 1.6l.6 2.9Z"/>
        <path d="m6.2 4 3.4 4"/><path d="m12 2.8 3.4 4"/>
        <path d="M3 10h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8Z"/>
      </svg>
    </div>
    <h2 id="waiting-title">Sincronizando conteúdo…</h2>
    <p  id="waiting-msg">Aguarde enquanto o display é configurado.</p>
  </div>

  <!-- ── HUD (barra inferior) ── -->
  <div id="hud" class="hud hidden">
    <div class="hud-left">
      <span id="hud-display-name" class="hud-display-name"></span>
    </div>
    <div class="hud-center">
      <span id="hud-title" class="hud-video-title"></span>
    </div>
    <div class="hud-right">
      <span id="hud-status" class="hud-status status-ok">● online</span>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
